name: Atualizar imóveis

# Frequência configurável: por padrão, uma vez por dia às 09:00 UTC
# (06:00 em America/Sao_Paulo).  Ajuste o cron abaixo se desejar.
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simular sem gravar nem commitar"
        type: boolean
        default: false
      skip_collect:
        description: "Usar os CSVs já existentes (sem acessar os portais)"
        type: boolean
        default: false
      max_imoveis:
        description: "Limite opcional de imóveis por coletor (teste)"
        required: false
        default: ""
      no_geocode:
        description: "Não consultar Nominatim/Photon nesta execução"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: atualizar-imoveis
  cancel-in-progress: false

env:
  TZ: America/Sao_Paulo
  PYTHONUNBUFFERED: "1"
  IMOVEIS_GEOCODE_MAX: "200"

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Cache do Chromium do Playwright
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Instalar Chromium (BB/Santander/Itaú)
        run: playwright install --with-deps chromium

      - name: Testes automatizados
        run: python -m pytest -q

      - name: Atualizar dados
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          SKIP_COLLECT: ${{ inputs.skip_collect || 'false' }}
          MAX_IMOVEIS: ${{ inputs.max_imoveis || '' }}
          NO_GEOCODE: ${{ inputs.no_geocode || 'false' }}
        run: |
          ARGS="--json"
          if [ "$DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "$SKIP_COLLECT" = "true" ]; then ARGS="$ARGS --skip-collect"; fi
          if [ "$NO_GEOCODE" = "true" ]; then ARGS="$ARGS --no-geocode"; fi
          if [ -n "$MAX_IMOVEIS" ]; then ARGS="$ARGS --max-imoveis $MAX_IMOVEIS"; fi
          python scripts/atualizar_imoveis.py $ARGS | tee /tmp/resumo-atualizacao.json

      - name: Validar JSON publicado
        run: python scripts/atualizar_imoveis.py --validate-only

      - name: Commitar dados atualizados
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data public
          if git diff --cached --quiet; then
            echo "Sem alterações para commitar."
            exit 0
          fi
          git commit -m "dados: atualização automática $(date -u '+%Y-%m-%d %H:%M UTC')"

          # O main pode andar durante a execução (merge de PR, coleta do Pi).
          # Sem isso o push falha e o run inteiro é perdido.
          for tentativa in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push rejeitado; sincronizando com o main e tentando de novo ($tentativa/3)…"
            if ! git pull --rebase --no-edit origin main; then
              git rebase --abort || true
              exit 1
            fi
          done
          echo "não foi possível enviar o commit após 3 tentativas"
          exit 1

      - name: Disparar deploy hook da Cloudflare (opcional)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
        env:
          DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "CLOUDFLARE_DEPLOY_HOOK_URL não configurado; o Pages fará o deploy via Git."
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$DEPLOY_HOOK"

      - name: Verificar fontes com falha
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
        run: python scripts/checar_fontes.py --max-stale-days 3

      - name: Enviar e-mail de alerta
        if: failure()
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURITY: ${{ secrets.SMTP_SECURITY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: python scripts/enviar_alerta_email.py
