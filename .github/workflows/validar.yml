name: Validar projeto

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências de teste
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests beautifulsoup4

      - name: Testes
        run: python -m pytest -q

      - name: Validar JSON publicado
        run: python scripts/atualizar_imoveis.py --validate-only
